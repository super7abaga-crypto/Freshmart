{% if message %}<div class="msg {{ message[0] }}">{{ message[1] }}</div>{% endif %}
{% if known %}
<form hx-post="/ui/login" hx-target="#authBody" hx-swap="innerHTML">
  <p style="margin:0 0 12px;font-size:.95rem;">Welcome back, {{ known.name }}! Sign in as {{ known.email }}.</p>
  <input type="hidden" name="email" value="{{ known.email }}">
  <div class="field"><label>Password</label><input name="password" type="password" placeholder="At least 6 characters" required autofocus></div>
  <button class="btn-primary" type="submit">Sign in</button>
  <button class="btn-ghost" type="button" hx-get="/ui/signin" hx-target="#authBody" hx-swap="innerHTML">Not you? Use a different account</button>
</form>
{% else %}
<form hx-post="/ui/login" hx-target="#authBody" hx-swap="innerHTML">
  <div class="field"><label>Email</label><input name="email" type="email" placeholder="you@example.com" required></div>
  <div class="field"><label>Password</label><input name="password" type="password" placeholder="At least 6 characters" required></div>
  <button class="btn-primary" type="submit">Sign in</button>
  <div class="small-note">New here? Use the "Create account" button in the header instead.</div>
</form>
{% endif %}
