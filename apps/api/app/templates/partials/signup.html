{% if message %}<div class="msg {{ message[0] }}">{{ message[1] }}</div>{% endif %}
<form hx-post="/ui/signup" hx-target="#signupBody" hx-swap="innerHTML">
  <div class="field"><label>Full name</label><input name="name" placeholder="e.g. Ada Bello" value="{{ form.get('name', '') }}" required></div>
  <div class="field"><label>Phone number</label><input name="phone" placeholder="0801 234 5678" value="{{ form.get('phone', '') }}" required></div>
  <div class="field"><label>Email</label><input name="email" type="email" placeholder="you@example.com" value="{{ form.get('email', '') }}" required></div>
  <div class="field"><label>Password</label><input name="password" type="password" placeholder="At least 6 characters" required></div>
  <div class="field"><label>Confirm password</label><input name="password_confirm" type="password" placeholder="Re-enter your password" required></div>
  <button class="btn-primary" type="submit">Create account</button>
  <div class="small-note">Already have an account? Use the "Sign in" button in the header instead.</div>
</form>
