{# Expects `o` (an order). Shows the status and a progress bar. #}
{% set pct = progress_map.get(o.status, 0) %}
<div style="margin-top:6px;"><span class="status-pill">{{ o.status }}</span></div>
{% if o.status != "Cancelled" %}
<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ pct }}" aria-label="Order progress">
  <div class="progress-bar" style="width:{{ pct }}%;"></div>
</div>
{% endif %}
