{# Header account buttons. Re-rendered after sign in / sign out. #}
{% if user %}
  <button class="icon-btn" id="accountBtn" type="button"
          hx-get="/ui/orders" hx-target="#ordersList" hx-swap="innerHTML"
          data-open-modal="ordersOverlay">👤 <span id="accountLabel">{{ user.name.split(' ')[0] }}</span></button>
  <button class="icon-btn" id="logoutBtn" type="button"
          hx-post="/ui/logout" hx-target="#account-area" hx-swap="innerHTML">⎋ Sign out</button>
{% else %}
  <button class="icon-btn" id="accountBtn" type="button"
          hx-get="/ui/signin" hx-target="#authBody" hx-swap="innerHTML"
          data-open-modal="authOverlay" data-last-email>👤 <span id="accountLabel">Sign in</span></button>
  <button class="icon-btn" id="createAcctBtn" type="button"
          hx-get="/ui/signup" hx-target="#signupBody" hx-swap="innerHTML"
          data-open-modal="signupOverlay">📝 Create account</button>
{% endif %}
