# Render Blueprint: deploys the Python (FastAPI) backend, which also serves
# the frontend, plus a managed Postgres database.
#
# Push this repo to GitHub, then in Render choose New + -> Blueprint and
# point it at the repo. See README.md for manual setup.

databases:
  - name: fatoke-market-db
    plan: free
    databaseName: fatoke_market
    user: fatoke_market

services:
  - type: web
    name: fatoke-market
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: fatoke-market-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STORE_STAFF_KEY
        generateValue: true
